# CI: lint (Verilator) + directed sim (Icarus) + PyUVM-on-cocotb functional tier +
# functional coverage (cocotb_coverage) + line coverage + bound SVA + formal (SymbiYosys) + synth.
# Standard job layout (see ../DV_STANDARDS.md): regress (fast gate) → pyuvm / fcov / coverage / sva / formal / synth.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pin OSS CAD Suite for reproducible formal CI; bump when upgrading tools.
  OSS_CAD_SUITE_VERSION: "2026-04-13"
  # Pinned Verible release for the advisory style-lint job (chipsalliance/verible).
  VERIBLE_VERSION: "v0.0-3946-g851d3ff4"

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator

      - name: Lint (Verilator) + directed simulation + stress
        run: make regress && make stress

  coverage:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
          # Pin the cocotb 1.9.x line: its Verilator floor is 4.106 (apt ships
          # 5.020), whereas cocotb 2.x requires Verilator >= 5.036.
          pip install "cocotb==1.9.2" "pyuvm==4.0.1"

      - name: Verilator --coverage-line on the pyuvm run
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/coverage.txt
          if-no-files-found: ignore

  pyuvm:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y verilator
          # cocotb 1.9.x: Verilator floor 4.106 (apt ships 5.020); cocotb 2.x
          # needs Verilator >= 5.036.
          pip install "cocotb==1.9.2" "pyuvm==4.0.1"

      - name: PyUVM functional tier (round-trip + random, scoreboard cross-check)
        run: make pyuvm

  fcov:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          # Pinned so the three coexist: cocotb_coverage 1.2.0 supports the
          # cocotb 1.9.x line, and pyuvm 4.0.1 allows cocotb >=1.6,<3.
          pip install "cocotb==1.9.2" "cocotb_coverage==1.2.0" "pyuvm==4.0.1"

      - name: Functional coverage (cocotb_coverage, Icarus engine, gate 100%)
        run: make fcov FCOV_SIM=icarus

  sva:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y verilator
          # cocotb 1.9.x (Verilator floor 4.106) works with apt's 5.020.
          pip install "cocotb==1.9.2" "pyuvm==4.0.1"

      - name: Bound SVA (Verilator --assert) under the round-trip run
        run: make sva

  formal:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE_VERSION }}

      - name: SymbiYosys formal (infra modules proven; bridge top bmc + cover)
        run: make formal

  synth:
    needs: regress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE_VERSION }}

      - name: Yosys synthesis smoke (no inferred latches)
        run: make synth

  # Advisory SystemVerilog style-lint (Verible). Non-blocking.
  verible:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install Verible ${{ env.VERIBLE_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz"
          echo "Fetching $url"
          curl -fsSL "$url" -o /tmp/verible.tar.gz
          mkdir -p /tmp/verible
          tar -xzf /tmp/verible.tar.gz -C /tmp/verible --strip-components=1
          echo "/tmp/verible/bin" >> "$GITHUB_PATH"

      - name: Verible style-lint (advisory)
        run: make verible-lint
